<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:linear-gradient(#163240,#264a52 55%,#7a4a3a)}canvas{image-rendering:pixelated;display:block;margin:6px}#row{display:flex;flex-wrap:wrap;align-items:flex-end}</style></head>
<body><div id="row"></div>
<script>
function hexRgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function rgbHex(r,g,b){var f=v=>('0'+Math.max(0,Math.min(255,Math.round(v))).toString(16)).slice(-2);return'#'+f(r)+f(g)+f(b);}
function shade(hex,pct){var c=hexRgb(hex),f=pct<0?0:255,p=Math.abs(pct)/100;return rgbHex((f-c[0])*p+c[0],(f-c[1])*p+c[1],(f-c[2])*p+c[2]);}
function mix(a,b,t){var A=hexRgb(a),B=hexRgb(b);return rgbHex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t);}
function inEll(gx,gy,cx,cy,rx,ry){var dx=(gx-cx)/rx,dy=(gy-cy)/ry;return dx*dx+dy*dy<=1;}
function inRect(gx,gy,x,y,w,h){return gx>=x&&gx<x+w&&gy>=y&&gy<y+h;}
function sgn(ax,ay,bx,by,cx,cy){return(ax-cx)*(by-cy)-(bx-cx)*(ay-cy);}
function inTri(px,py,A,B,C){var d1=sgn(px,py,A[0],A[1],B[0],B[1]),d2=sgn(px,py,B[0],B[1],C[0],C[1]),d3=sgn(px,py,C[0],C[1],A[0],A[1]);return!(((d1<0)||(d2<0)||(d3<0))&&((d1>0)||(d2>0)||(d3>0)));}
function inPoly(px,py,pts){var inside=false;for(var i=0,j=pts.length-1;i<pts.length;j=i++){var xi=pts[i][0],yi=pts[i][1],xj=pts[j][0],yj=pts[j][1];if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi))inside=!inside;}return inside;}
function cover(s,gx,gy){var cx=gx+0.5,cy=gy+0.5;return s.t==='ell'?inEll(cx,cy,s.p[0],s.p[1],s.p[2],s.p[3]):s.t==='rect'?inRect(cx,cy,s.p[0],s.p[1],s.p[2],s.p[3]):s.t==='poly'?inPoly(cx,cy,s.p):inTri(cx,cy,s.p[0],s.p[1],s.p[2]);}

var GW=72, GH=42;
function shapes(flap){
  var lift=((flap==null?0.5:flap)-0.5)*5.0;
  var S=[];
  var bx=34, by=26.5, brx=13, bry=5.3;           // body (low, long)
  var hx=55.5, hy=22.0, hr=7.6;                  // head (forward-right, slightly up)
  var sx=hx+hr*0.72, sy=hy+hr*0.5;              // snout tip
  var sh=[bx+brx*0.52, by-bry*0.7];             // shoulder

  // FAR wing (behind, darkest) for depth
  (function(){ var W=[bx-brx*0.02,by-bry*2.9+lift*0.7], T=[bx-brx*0.78,by-bry*3.7+lift];
    S.push({k:'k',t:'poly',p:[[sh[0]-1.4,sh[1]],W,T,[bx-brx*1.0,by-bry*1.3+lift*0.4],[bx-brx*0.05,by-bry*0.2]]}); })();

  // TAIL — taper left, cream fin-spikes on top, fish-tail cluster at tip
  (function(){ var tr=bx-brx*0.92, ty=by, tip=[tr-brx*1.42, by+bry*0.8];
    S.push({k:'B',t:'poly',p:[[tr,ty-bry*0.5],[tr-brx*0.86,by-bry*0.05],[tip[0]+0.5,tip[1]-1.0],[tip[0]+0.5,tip[1]+0.8],[tr-brx*0.78,by+bry*0.72],[tr,ty+bry*0.55]]});
    S.push({k:'M',t:'poly',p:[[tr-brx*0.24,ty+bry*0.3],[tr-brx*0.86,by+bry*0.52],[tip[0]+0.6,tip[1]+0.5],[tip[0]+1.8,tip[1]-0.3]]});
    var fb=[[tr-0.6,ty-bry*0.42],[tr-brx*0.5,by-bry*0.26],[tr-brx*1.0,by-bry*0.02],[tr-brx*1.46,by+bry*0.32]];
    fb.forEach(function(p,i){ var h=3.2-i*0.35; S.push({k:'C',t:'tri',p:[[p[0]-0.9,p[1]+0.4],[p[0]+1.1,p[1]-h],[p[0]+1.5,p[1]+0.6]]}); });
    S.push({k:'C',t:'tri',p:[[tip[0]+1.5,tip[1]-0.4],[tip[0]-3.0,tip[1]-2.9],[tip[0]-0.3,tip[1]-0.6]]});
    S.push({k:'C',t:'tri',p:[[tip[0]+1.5,tip[1]+0.2],[tip[0]-3.4,tip[1]+0.4],[tip[0]-0.2,tip[1]+1.2]]});
    S.push({k:'M',t:'tri',p:[[tip[0]+1.3,tip[1]-0.2],[tip[0]-1.3,tip[1]-0.6],[tip[0]-1.0,tip[1]+0.5]]});
  })();

  // FAR legs (tucked, darker, bent)
  [[-0.42,-1],[0.6,1]].forEach(function(d){ var hipx=bx+brx*d[0], hy0=by+bry*0.8;
    S.push({k:'M',t:'poly',p:[[hipx,hy0],[hipx+d[1]*1.3,hy0+bry*1.05],[hipx+d[1]*2.1,hy0+bry*0.95],[hipx+d[1]*0.85,hy0+bry*1.95],[hipx+d[1]*1.45,hy0+bry*2.0],[hipx+d[1]*2.7,hy0+bry*0.85],[hipx+d[1]*1.25,hy0-bry*0.1]]}); });

  // BODY
  S.push({k:'B',t:'ell',p:[bx,by,brx,bry]});
  S.push({k:'K',t:'poly',p:[[bx-brx*1.0,by-bry*0.05],[bx-brx*0.55,by-bry*0.82],[bx+brx*0.55,by-bry*0.88],[bx+brx*1.0,by-bry*0.02],[bx+brx*0.55,by-bry*0.3],[bx-brx*0.5,by-bry*0.26]]});  // dark back
  S.push({k:'L',t:'ell',p:[bx+brx*0.08,by+bry*0.54,brx*0.82,bry*0.5]});   // belly light
  S.push({k:'M',t:'ell',p:[bx-brx*0.12,by+bry*0.68,brx*0.6,bry*0.3]});    // belly shade
  [-0.5,-0.16,0.18,0.5].forEach(function(fx){ S.push({k:'C',t:'tri',p:[[bx+brx*fx-0.9,by-bry*0.78],[bx+brx*fx,by-bry*1.32],[bx+brx*fx+0.9,by-bry*0.78]]}); });  // back ridge

  // NEAR legs (bent running) + claws
  (function(){
    S.push({k:'B',t:'poly',p:[[bx-brx*0.32,by+bry*0.6],[bx-brx*0.58,by+bry*1.5],[bx-brx*0.86,by+bry*1.4],[bx-brx*0.96,by+bry*2.15],[bx-brx*0.58,by+bry*2.25],[bx-brx*0.42,by+bry*1.5],[bx-brx*0.04,by+bry*0.95]]});
    S.push({k:'k',t:'tri',p:[[bx-brx*1.0,by+bry*2.1],[bx-brx*1.32,by+bry*2.58],[bx-brx*0.62,by+bry*2.48]]});
    S.push({k:'B',t:'poly',p:[[bx+brx*0.6,by+bry*0.55],[bx+brx*0.86,by+bry*1.4],[bx+brx*1.2,by+bry*1.3],[bx+brx*1.32,by+bry*2.1],[bx+brx*0.98,by+bry*2.2],[bx+brx*0.8,by+bry*1.45],[bx+brx*0.86,by+bry*0.7]]});
    S.push({k:'k',t:'tri',p:[[bx+brx*0.94,by+bry*2.05],[bx+brx*1.5,by+bry*2.45],[bx+brx*1.34,by+bry*2.62]]});
  })();

  // NECK + HEAD
  S.push({k:'B',t:'poly',p:[[sh[0]-1.6,sh[1]+1.0],[hx-hr*0.84,hy-hr*0.3],[hx-hr*0.28,hy+hr*0.55],[sh[0]+0.8,sh[1]+2.8]]});
  S.push({k:'K',t:'poly',p:[[sh[0]-1.6,sh[1]+0.5],[hx-hr*0.9,hy-hr*0.48],[hx-hr*0.52,hy-hr*0.04],[sh[0]-0.2,sh[1]+1.4]]});  // dark nape
  S.push({k:'B',t:'ell',p:[hx,hy,hr,hr*0.88]});
  S.push({k:'K',t:'poly',p:[[hx-hr*0.92,hy-hr*0.16],[hx-hr*0.2,hy-hr*0.72],[hx+hr*0.46,hy-hr*0.48],[hx-hr*0.28,hy-hr*0.06]]});  // dark crown
  S.push({k:'L',t:'ell',p:[hx-hr*0.1,hy+hr*0.46,hr*0.64,hr*0.4]});   // cheek light
  S.push({k:'B',t:'ell',p:[sx-hr*0.4,sy-hr*0.04,hr*0.58,hr*0.44]});  // muzzle
  S.push({k:'L',t:'ell',p:[sx-hr*0.48,sy-hr*0.26,hr*0.3,hr*0.17]});  // nose bridge
  S.push({k:'n',t:'rect',p:[sx+hr*0.08,sy-hr*0.06,1.1,1.1]});        // nostril
  S.push({k:'o',t:'poly',p:[[sx+hr*0.08,sy+hr*0.34],[sx+hr*0.08,sy+hr*0.46],[sx-hr*0.92,sy+hr*0.5],[sx-hr*0.92,sy+hr*0.38]]});  // mouth line

  // eye + brow
  var ex=hx+hr*0.26, ey=hy-hr*0.02;
  S.push({k:'o',t:'poly',p:[[ex-hr*0.5,ey-hr*0.5],[ex+hr*0.5,ey-hr*0.64],[ex+hr*0.5,ey-hr*0.44],[ex-hr*0.5,ey-hr*0.32]]});  // brow
  S.push({k:'e',t:'ell',p:[ex,ey,hr*0.4,hr*0.46]});
  S.push({k:'p',t:'ell',p:[ex+hr*0.1,ey+hr*0.1,hr*0.27,hr*0.32]});
  S.push({k:'g',t:'ell',p:[ex-hr*0.12,ey-hr*0.14,hr*0.11,hr*0.13]});

  // NEAR wing — dark membrane + cream radiating bones + scalloped trailing edge
  (function(){
    var S0=[sh[0]-0.4,sh[1]+0.7];
    var W0=[bx-brx*0.04,by-bry*3.4+lift*0.82];
    var T0=[bx-brx*0.72,by-bry*4.4+lift];
    var f1=[bx-brx*1.1,by-bry*2.8+lift*0.5];
    var f2=[bx-brx*0.96,by-bry*1.5+lift*0.26];
    var f3=[bx-brx*0.58,by-bry*0.46+lift*0.06];
    var f4=[bx+brx*0.46,by-bry*0.12];
    var c1=[(W0[0]+f1[0])/2+1.0,(W0[1]+f1[1])/2+1.2];
    var c2=[(W0[0]+f2[0])/2+1.5,(W0[1]+f2[1])/2+1.1];
    var c3=[(W0[0]+f3[0])/2+1.7,(W0[1]+f3[1])/2+0.85];
    var c4=[(W0[0]+f4[0])/2+1.1,(W0[1]+f4[1])/2+0.5];
    S.push({k:'K',t:'poly',p:[S0,W0,T0,f1,c1,f2,c2,f3,c3,f4,c4]});      // dark membrane (scalloped)
    var u1=[W0[0]*0.55+T0[0]*0.45,W0[1]*0.55+T0[1]*0.45+1.4];
    var u2=[S0[0]*0.5+W0[0]*0.5+0.8,S0[1]*0.5+W0[1]*0.5+1.6];
    S.push({k:'B',t:'poly',p:[S0,W0,T0,u1,u2]});                       // cream upper band
    S.push({k:'L',t:'poly',p:[S0,W0,T0,[(T0[0]+u1[0])/2,(T0[1]+u1[1])/2],[(S0[0]+u2[0])/2,(S0[1]+u2[1])/2]]});  // highlight
    [f1,f2,f3,f4].forEach(function(f){ S.push({k:'C',t:'tri',p:[[W0[0],W0[1]],[f[0],f[1]],[f[0]+0.95,f[1]+0.85]]}); });  // cream bones
    S.push({k:'C',t:'poly',p:[[S0[0]-0.5,S0[1]-0.4],[W0[0]-0.5,W0[1]-0.4],[T0[0]+0.2,T0[1]+0.2],[T0[0]+1.0,T0[1]+0.9],[W0[0]+0.6,W0[1]+0.7],[S0[0]+0.6,S0[1]+0.5]]});  // leading-edge bone
  })();

  // CREST mane (bright, drawn on top) + nape + jaw barbel
  (function(){
    var cx0=hx-hr*0.04, cy0=hy-hr*0.72;
    var fan=[[1.0,-2.0],[0.6,-2.5],[0.16,-2.85],[-0.32,-2.9],[-0.82,-2.65],[-1.34,-2.28],[-1.86,-1.82]];
    fan.forEach(function(d){ var ox=cx0+d[0]*hr*0.22, oy=cy0+Math.max(0,-d[0])*0.18; var tx=ox+d[0]*1.9, ty=oy+d[1]*1.7;
      S.push({k:'C',t:'tri',p:[[ox-1.05,oy+0.7],[tx,ty],[ox+1.15,oy+0.6]]}); });
    var np=[[hx-hr*1.02,hy-hr*0.24,3.0],[hx-hr*1.5,hy-hr*0.0,2.6]];
    np.forEach(function(p){ S.push({k:'C',t:'tri',p:[[p[0]+0.8,p[1]+0.55],[p[0]-p[2]*0.7,p[1]-p[2]],[p[0]-0.3,p[1]-0.1]]}); });
    S.push({k:'C',t:'tri',p:[[hx-hr*0.44,hy+hr*0.78],[hx-hr*1.12,hy+hr*1.12],[hx-hr*0.38,hy+hr*1.08]]});
  })();
  return S;
}
function buildGrid(flap){
  var sh=shapes(flap);
  var g=[];for(var y=0;y<GH;y++)g.push(new Array(GW).fill(null));
  for(var s of sh)for(var y=0;y<GH;y++)for(var x=0;x<GW;x++){if(cover(s,x,y))g[y][x]=s.k;}
  var og=g.map(r=>r.slice());
  var fil=(x,y)=>x>=0&&x<GW&&y>=0&&y<GH&&g[y][x]!=null;
  for(var y=0;y<GH;y++)for(var x=0;x<GW;x++){if(g[y][x]==null&&(fil(x-1,y)||fil(x+1,y)||fil(x,y-1)||fil(x,y+1)))og[y][x]='o';}
  return og;
}
function pal(base){ return {
  o:'#1b141b', k:mix('#201d24',base,0.16), K:mix('#2e2b32',base,0.24), M:shade(base,-26), B:base, L:shade(base,32), C:shade(base,56),
  e:'#ffffff', p:'#241a26', g:'#ffffff', n:'#1b141b' }; }
function draw(base, flap, PX){
  var grid=buildGrid(flap), p=pal(base);
  var cv=document.createElement('canvas'); cv.width=GW*PX; cv.height=GH*PX; document.getElementById('row').appendChild(cv);
  var x=cv.getContext('2d');
  for(var gy=0;gy<GH;gy++)for(var gx=0;gx<GW;gx++){var k=grid[gy][gx];if(!k)continue;x.fillStyle=p[k];x.fillRect(gx*PX,gy*PX,PX,PX);}
}
draw('#e0b94a',0.5,7);
draw('#e0b94a',0.12,7);
draw('#e0b94a',0.5,2.4);
draw('#e0463e',0.5,5);
draw('#4a92dc',0.5,5);
draw('#58c272',0.5,5);
document.title="dragontest v6";
</script>
</body></html>
