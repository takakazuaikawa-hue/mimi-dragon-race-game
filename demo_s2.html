<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>S2デモ — 意匠フレーム試作（決裁用）</title>
<style>
  html,body { margin:0; height:100%; background:#0a1013; }
  #frame { border:0; width:100%; height:100%; display:block; }
  #s2bar { position:fixed; left:50%; bottom:10px; transform:translateX(-50%); z-index:99999;
    display:flex; gap:6px; padding:6px; border-radius:999px;
    background:rgba(10,14,18,.88); border:1px solid rgba(255,216,119,.5);
    box-shadow:0 10px 30px rgba(0,0,0,.6); font-family:"Hiragino Sans","Yu Gothic",sans-serif; }
  #s2bar button { border:0; border-radius:999px; padding:9px 18px; font-size:13px; font-weight:900;
    background:transparent; color:#cfc7b8; cursor:pointer; }
  #s2bar button.on { background:linear-gradient(180deg,#ffeaa6,#dc9c33); color:#3a2a08; }
  #s2note { position:fixed; left:50%; bottom:58px; transform:translateX(-50%); z-index:99999;
    font-size:11px; color:#9fb0a8; font-family:sans-serif; background:rgba(10,14,18,.7);
    padding:3px 10px; border-radius:8px; pointer-events:none; white-space:nowrap; }
</style>
</head>
<body>
<iframe id="frame" src="index.html"></iframe>
<div id="s2note">見どころ：？ボタンやポップアップの「窓」。どの画面でも切替可</div>
<div id="s2bar">
  <button id="bOff" class="on">元の窓</button>
  <button id="bOn">S2 意匠フレーム</button>
</div>
<script>
// =========================================================================
// S2デモ：生成した意匠フレーム1枚を 9-slice（border-image）で「窓（.navpop）」だけに当てる。
//   ソースは書き換えない＝上書き<style>1枚の注入/除去（S1デモで実証済みの型）。
//   判断基準＝「化けた」と感じるか。NOならS2路線ごと撤退（それがこの試作の目的）。
// =========================================================================
var FRAME_IMG = "images/ui/frame_gold.png";    // 生成した枠（9-slice素材・512px・四隅=竜）
var SLICE = 150;                                // 枠画像の四隅の厚み（512px画像の実測・竜の張り出しまで）
var WIDTH = "28px";                             // 画面上での枠の太さ
var applied = false;
function apply(){
  var doc = document.getElementById("frame").contentDocument;
  var st = doc.createElement("style");
  st.id = "__s2_override";
  st.textContent =
    ".navpop{" +
      "border: " + WIDTH + " solid transparent;" +
      "border-image: url('" + FRAME_IMG + "') " + SLICE + " / " + WIDTH + " stretch;" +
      "border-radius: 0;" +                    /* border-image は角丸と併用不可＝四隅は絵が担う */
      "background-clip: padding-box;" +
    "}";
  doc.head.appendChild(st);
}
function restore(){
  var doc = document.getElementById("frame").contentDocument;
  var st = doc.getElementById("__s2_override");
  if (st) st.remove();
}
var bOn=document.getElementById("bOn"), bOff=document.getElementById("bOff");
bOn.onclick=function(){ if(applied) return; apply(); applied=true; bOn.classList.add("on"); bOff.classList.remove("on"); };
bOff.onclick=function(){ if(!applied) return; restore(); applied=false; bOff.classList.add("on"); bOn.classList.remove("on"); };
</script>
</body>
</html>
