<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block;margin:0 auto 10px}</style></head>
<body>
<script>
// ===== Skyline v2 — 描き込み系・時間帯別の本格遠景 =====
// 大気遠近 / 天体のコロナ・光芒 / 天の川 / 立体的な雲 / 稜線のリムライト・冠雪 / 水面反射。
// 純Canvas。後で race_canvas.js の rcRenderSkyBase へ移植する。
function hx(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255];}
function mix(a,b,t){const A=hx(a),B=hx(b);return`rgb(${Math.round(A[0]+(B[0]-A[0])*t)},${Math.round(A[1]+(B[1]-A[1])*t)},${Math.round(A[2]+(B[2]-A[2])*t)})`;}
function rgba(h,a){const c=hx(h);return`rgba(${c[0]},${c[1]},${c[2]},${a})`;}

const CONF = {
  morning: {
    sky:[[0,'#3f6ea3'],[0.3,'#7ba0c4'],[0.58,'#cdd3cf'],[0.8,'#f3dcb8'],[1,'#f7c79a']],
    horizon:0.70, sun:{x:0.26,y:0.60,r:26,core:'#fff6e0',glow:'#ffd9a0',rays:0.18,warm:1},
    cloud:{lit:'#fff3e2',sh:'#b9b6c0',y:0.26,cover:0.9},
    mtnFar:'#9fb0b8', mtnNear:'#5a6f6b', rim:'#ffe7c0', snow:0.25, haze:'#f3dcc0',
    water:0.0, stars:0, milky:0, grade:['#ffe7c0',0.05]
  },
  day: {
    sky:[[0,'#2f72b8'],[0.4,'#5d98cf'],[0.74,'#a8cbe0'],[1,'#dde9e6']],
    horizon:0.72, sun:{x:0.73,y:0.16,r:20,core:'#ffffff',glow:'#fff6cf',rays:0.12,warm:1},
    cloud:{lit:'#ffffff',sh:'#b4c2cf',y:0.24,cover:1.1},
    mtnFar:'#9bbcc4', mtnNear:'#52786a', rim:'#eaffe0', snow:0.4, haze:'#dbe8e2',
    water:0.0, stars:0, milky:0, grade:['#cfe6ff',0.04]
  },
  sunset: {
    sky:[[0,'#21305f'],[0.26,'#5b4a86'],[0.5,'#a55c83'],[0.72,'#e8825a'],[0.9,'#f7b65c'],[1,'#ffd778']],
    horizon:0.71, sun:{x:0.31,y:0.66,r:40,core:'#fff0c4',glow:'#ff8c45',rays:0.5,warm:1},
    cloud:{lit:'#ffd0a0',sh:'#7c5a78',y:0.3,cover:1.0},
    mtnFar:'#9a6f86', mtnNear:'#3a2a40', rim:'#ffb066', snow:0.0, haze:'#f6a866',
    water:0.0, stars:0, milky:0, grade:['#ff9a55',0.06]
  },
  dusk: {
    sky:[[0,'#10183a'],[0.3,'#2c2a5e'],[0.56,'#5e3f74'],[0.78,'#a85a6e'],[1,'#e08a5a']],
    horizon:0.71, sun:{x:0.72,y:0.72,r:30,core:'#ffe2b0',glow:'#d66a5e',rays:0.34,warm:1},
    cloud:{lit:'#e7a48c',sh:'#3a2f54',y:0.28,cover:0.85},
    mtnFar:'#5a4f7a', mtnNear:'#241d38', rim:'#c87a86', snow:0.0, haze:'#a85e5a',
    water:0.0, stars:70, milky:0.25, grade:['#7a5e9a',0.06]
  },
  night: {
    sky:[[0,'#05081c'],[0.4,'#0c1336'],[0.72,'#1a2350'],[1,'#2a3463']],
    horizon:0.71, moon:{x:0.76,y:0.2,r:30,core:'#f4f7ff',glow:'#9fb6e6',rays:0,warm:0},
    cloud:{lit:'#5a6694',sh:'#161d3c',y:0.22,cover:0.5},
    mtnFar:'#222a52', mtnNear:'#12173e', rim:'#aac0ee', snow:0.2, haze:'#2a3158',
    water:0.0, stars:220, milky:1, grade:['#1a2a5a',0.05]
  }
};

function ridgeY(px,W,baseY,amp,seed){
  const u=px/W;
  return baseY - amp*(0.5*Math.sin(u*5.2+seed)+0.26*Math.sin(u*11.4+seed*1.7)+0.14*Math.sin(u*22.3+seed*2.3)+0.08*Math.sin(u*41+seed*3.1));
}

function renderSky(x, W, H, time){
  const c = CONF[time] || CONF.night;
  const HOR = H*c.horizon;
  const cel = c.sun || c.moon; const isMoon = !!c.moon;
  const sx = cel.x*W, sy = cel.y*H, sc = W/1536;

  // --- sky gradient ---
  const g = x.createLinearGradient(0,0,0,HOR+H*0.04);
  c.sky.forEach(s=>g.addColorStop(s[0],s[1])); x.fillStyle=g; x.fillRect(0,0,W,H);

  // --- milky way (night/dusk) ---
  if (c.milky){
    x.save(); x.translate(W*0.5,H*0.32); x.rotate(-0.5);
    const mw=x.createLinearGradient(0,-H*0.16,0,H*0.16);
    mw.addColorStop(0,'rgba(120,140,210,0)'); mw.addColorStop(0.5,rgba('#7c8fd6',0.10*c.milky)); mw.addColorStop(1,'rgba(120,140,210,0)');
    x.fillStyle=mw; x.fillRect(-W,-H*0.16,W*2,H*0.32);
    // nebula blobs
    x.filter='blur(22px)';
    for(let i=0;i<5;i++){ x.fillStyle=rgba(i%2?'#6a5aa8':'#4a6ab0',0.06*c.milky); x.beginPath(); x.ellipse(-W*0.4+i*W*0.22,(i%2?-1:1)*H*0.03,W*0.16,H*0.05,0,0,7); x.fill(); }
    x.filter='none'; x.restore();
  }

  // --- stars (varied brightness; cluster in milky band) ---
  if (c.stars){
    for(let i=0;i<c.stars;i++){
      const rx=((i*73.13)%1), ry=((i*131.7)%1);
      const px=rx*W, py=ry*HOR*0.96;
      const br=0.25+((i*37)%100)/100*0.75;
      const big=(i%17===0);
      const r=big?1.7*sc:0.8*sc;
      x.fillStyle=`rgba(255,255,255,${br*(big?1:0.8)})`;
      x.beginPath(); x.arc(px,py,r,0,7); x.fill();
      if(big){ x.strokeStyle=`rgba(255,255,255,${br*0.5})`; x.lineWidth=0.6*sc; x.beginPath(); x.moveTo(px-3*sc,py); x.lineTo(px+3*sc,py); x.moveTo(px,py-3*sc); x.lineTo(px,py+3*sc); x.stroke(); }
    }
  }

  // --- celestial: corona + god rays + disc (+craters for moon) ---
  // outer corona
  const cor=x.createRadialGradient(sx,sy,0,sx,sy,(cel.r*sc)*7.5);
  cor.addColorStop(0,rgba(cel.glow,isMoon?0.5:0.7)); cor.addColorStop(0.3,rgba(cel.glow,isMoon?0.18:0.3)); cor.addColorStop(1,rgba(cel.glow,0));
  x.fillStyle=cor; x.fillRect(0,0,W,H);
  // god rays
  if (cel.rays>0){
    x.save(); x.translate(sx,sy); x.globalCompositeOperation='lighter';
    for(let i=0;i<14;i++){ const a=i/14*Math.PI*2 + 0.3; const len=(cel.r*sc)*(7+ (i%3)*3);
      const gr=x.createLinearGradient(0,0,Math.cos(a)*len,Math.sin(a)*len);
      gr.addColorStop(0,rgba(cel.glow,0.10*cel.rays)); gr.addColorStop(1,rgba(cel.glow,0));
      x.fillStyle=gr; x.beginPath(); x.moveTo(0,0);
      x.lineTo(Math.cos(a-0.05)*len,Math.sin(a-0.05)*len); x.lineTo(Math.cos(a+0.05)*len,Math.sin(a+0.05)*len); x.closePath(); x.fill(); }
    x.restore();
  }
  // disc
  const disc=x.createRadialGradient(sx-cel.r*sc*0.3,sy-cel.r*sc*0.3,cel.r*sc*0.2,sx,sy,cel.r*sc);
  disc.addColorStop(0,cel.core); disc.addColorStop(0.7,cel.core); disc.addColorStop(1,mix(cel.core,cel.glow,0.5));
  x.fillStyle=disc; x.beginPath(); x.arc(sx,sy,cel.r*sc,0,7); x.fill();
  if (isMoon){ // craters
    x.fillStyle=rgba('#b8c4e0',0.35);
    [[0.3,-0.2,0.22],[-0.25,0.15,0.16],[0.1,0.35,0.13],[-0.35,-0.3,0.1]].forEach(cr=>{ x.beginPath(); x.arc(sx+cr[0]*cel.r*sc,sy+cr[1]*cel.r*sc,cr[2]*cel.r*sc,0,7); x.fill(); });
  }

  // --- volumetric clouds (lit top + shadow base, blurred) ---
  function cloud(cx,cy,s,seed){
    let rnd=seed||1; const rand=()=>{rnd=(rnd*9301+49297)%233280; return rnd/233280;};
    x.save(); x.filter='blur(9px)';
    const n=12+Math.floor(rand()*6);
    // soft flat-ish shadow base
    for(let i=0;i<n;i++){ const fx=cx+(rand()-0.5)*s*2.4; const fy=cy+rand()*s*0.36; const r=s*(0.24+rand()*0.52); x.fillStyle=rgba(c.cloud.sh,0.15); x.beginPath(); x.arc(fx,fy,r,0,7); x.fill(); }
    // puffy lit crown
    for(let i=0;i<n;i++){ const fx=cx+(rand()-0.5)*s*2.0; const fy=cy-rand()*s*0.52; const r=s*(0.2+rand()*0.46); x.fillStyle=rgba(c.cloud.lit,0.18); x.beginPath(); x.arc(fx,fy,r,0,7); x.fill(); }
    x.restore();
  }
  if (c.cloud.cover>0){
    const cv2=c.cloud.cover;
    cloud(W*0.17,H*c.cloud.y,122*sc*cv2,131);
    cloud(W*0.50,H*(c.cloud.y-0.06),94*sc*cv2,937);
    cloud(W*0.82,H*(c.cloud.y+0.03),138*sc*cv2,613);
    if(time==='day'||time==='morning'){ cloud(W*0.37,H*(c.cloud.y+0.12),80*sc,271); cloud(W*0.66,H*(c.cloud.y+0.02),66*sc,455); }
  }

  // --- layered mountains: atmospheric perspective + rim light + snow ---
  function range(baseY,amp,seed,col,rimA,snowA){
    x.beginPath(); x.moveTo(0,H);
    const pts=[];
    for(let px=0;px<=W;px+=3){ const y=ridgeY(px,W,baseY,amp,seed); pts.push([px,y]); x.lineTo(px,y); }
    x.lineTo(W,H); x.closePath(); x.fillStyle=col; x.fill();
    // rim light on the lit side
    if(rimA>0){ x.save(); x.lineWidth=1.6*sc; x.strokeStyle=rgba(c.rim,rimA); x.beginPath();
      for(let i=0;i<pts.length;i++){ const p=pts[i]; const litside=(p[0]<sx)? (pts[i+1]&&pts[i+1][1]>p[1]) : (pts[i-1]&&pts[i-1][1]>p[1]);
        if(i===0)x.moveTo(p[0],p[1]); else x.lineTo(p[0],p[1]); }
      x.stroke(); x.restore(); }
    // snow caps near peaks
    if(snowA>0){ x.fillStyle=rgba('#ffffff',snowA);
      for(let i=2;i<pts.length-2;i++){ const p=pts[i]; if(p[1]<pts[i-2][1]&&p[1]<pts[i+2][1]&&p[1]<baseY-amp*0.55){ x.beginPath(); x.moveTo(p[0],p[1]); x.lineTo(p[0]-4*sc,p[1]+7*sc); x.lineTo(p[0]+4*sc,p[1]+7*sc); x.closePath(); x.fill(); } } }
  }
  // far → near, atmospheric perspective (far = mixed toward haze)
  range(HOR-30*sc, 44*sc, 1.3, mix(c.mtnFar,c.haze,0.55), 0.22, 0);
  range(HOR-12*sc, 60*sc, 2.6, mix(c.mtnFar,c.mtnNear,0.4), 0.34, 0);
  range(HOR+12*sc, 84*sc, 3.7, c.mtnNear, 0.55, c.snow);

  // --- 聖龍門 gate + grandstand silhouette on the horizon ---
  (function(){ const gx=W*0.6, gy=HOR-2*sc, col=mix(c.mtnNear,'#000000',0.3);
    x.fillStyle=rgba(col,0.95);
    x.fillRect(gx-46*sc,gy-58*sc,9*sc,58*sc); x.fillRect(gx+37*sc,gy-58*sc,9*sc,58*sc);
    x.fillRect(gx-60*sc,gy-66*sc,120*sc,9*sc); x.fillRect(gx-50*sc,gy-52*sc,100*sc,6*sc);
    x.beginPath(); x.moveTo(gx-150*sc,gy); x.quadraticCurveTo(gx-188*sc,gy-30*sc,gx-228*sc,gy); x.closePath(); x.fill();
    x.beginPath(); x.ellipse(gx+150*sc,gy,60*sc,24*sc,0,Math.PI,0); x.fill();
    // gate rim catches the light
    x.strokeStyle=rgba(c.rim,0.5); x.lineWidth=1.2*sc;
    x.strokeRect(gx-60*sc,gy-66*sc,120*sc,2*sc);
  })();

  // --- horizon atmospheric haze ---
  const hb=x.createLinearGradient(0,HOR-90*sc,0,HOR+24*sc);
  hb.addColorStop(0,rgba(c.haze,0)); hb.addColorStop(0.75,rgba(c.haze,0.32)); hb.addColorStop(1,rgba(c.haze,0.62));
  x.save(); x.fillStyle=hb; x.fillRect(0,HOR-90*sc,W,114*sc); x.restore();

  // --- color grade + vignette ---
  x.save(); x.globalCompositeOperation='soft-light'; x.fillStyle=rgba(c.grade[0],c.grade[1]); x.fillRect(0,0,W,H); x.restore();
  const vg=x.createRadialGradient(W/2,H*0.42,H*0.3,W/2,H*0.42,W*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(4,6,14,0.34)'); x.fillStyle=vg; x.fillRect(0,0,W,H);
}

// ---- page: render requested time(s) ----
const params=new URLSearchParams(location.search);
const W=parseInt(params.get('w')||'760'), H=Math.round(W*0.55);
const times = params.get('all') ? ['morning','day','sunset','dusk','night'] : [params.get('t')||'night'];
times.forEach(t=>{
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H; document.body.appendChild(cv);
  const x=cv.getContext('2d'); renderSky(x,W,H,t);
  // track-cover guide line (in-race the lower part is hidden by the course ~0.56)
  x.strokeStyle='rgba(255,0,0,0.0)'; // off by default
  const lbl=document.createElement('div');
});
document.title="skytest2:"+times.join(",");
</script>
</body></html>
