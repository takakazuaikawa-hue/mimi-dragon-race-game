<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mimi Live2D ツール — PNG分解 & アイドルアニメ</title>
<link rel="stylesheet" href="css/live2d.css">
</head>
<body>
<header class="l2-top">
  <h1>🐲 Mimi Live2D ツール</h1>
  <nav class="l2-tabs">
    <button id="tab-editor" class="l2-tab on">① エディタ（分解・リグ）</button>
    <button id="tab-preview" class="l2-tab">② プレビュー（大）</button>
    <button id="tab-player" class="l2-tab">③ 再生（rig.json）</button>
  </nav>
</header>

<!-- ===================== EDITOR ===================== -->
<section id="pane-editor" class="l2-pane">
  <div id="ed-steps" class="l2-steps"></div>
  <div class="l2-actions">
    <button id="btn-open" class="l2-primary">📂 画像を開く (PNG)</button>
    <input id="ed-file" type="file" accept="image/*" hidden>
    <button id="btn-load-test">🧪 人物デモ (ミミ)</button>
    <button id="btn-demo">🐉 ドラゴンデモ</button>
    <button id="btn-ai-bg" title="ブラウザ内AI(RMBG-1.4)で高品質に背景を透過。初回のみモデルDLで数十秒">🤖 AI背景除去</button>
    <span class="l2-sep"></span>
    <button id="btn-preview" class="l2-primary">▶ アイドル再生</button>
    <button id="btn-preview-stop">⏸ 停止</button>
    <span class="l2-sep"></span>
    <button id="btn-export-embed" class="l2-primary">⬇ 書き出し (embed)</button>
    <button id="btn-export-files">⬇ 書き出し (分離)</button>
  </div>
  <div id="ed-toolbar" class="l2-toolbar"></div>
  <div class="l2-workspace">
    <div class="l2-canvas-wrap">
      <div class="l2-stage">
        <canvas id="ed-canvas"></canvas>
        <canvas id="ed-overlay" class="l2-overlay"></canvas>
      </div>
    </div>
    <aside class="l2-side">
      <div class="l2-preview-box">
        <h3>▶ プレビュー <span class="l2-hint">(調整が即反映)</span><button id="btn-enlarge" class="l2-mini-btn l2-enlarge" title="大きく表示（プレビュータブへ）">⛶ 拡大</button></h3>
        <canvas id="ed-preview" width="340" height="260" class="l2-preview"></canvas>
      </div>
      <div class="l2-parts-box">
        <h3>パーツ <span class="l2-hint">(上=前面)</span></h3>
        <div id="ed-parts" class="l2-parts"></div>
      </div>
    </aside>
  </div>
  <div id="ed-status" class="l2-status">画像を開くか「デモドラゴン生成」で開始。</div>
</section>

<!-- ===================== PREVIEW (large, current rig) ===================== -->
<section id="pane-preview" class="l2-pane" style="display:none">
  <div class="l2-prev-bar">
    <button id="pv-play" class="l2-primary" title="再生 / 一時停止">⏸ 一時停止</button>
    <span class="l2-sep"></span>
    <label class="l2-slider"><span>ズーム</span><input id="pv-zoom" type="range" min="0.3" max="2" step="0.05" value="0.92"><span id="pv-zoom-val" class="l2-val">0.92</span></label>
    <span class="l2-sep"></span>
    <span class="l2-prev-lbl">背景</span>
    <span class="l2-seg" id="pv-bg">
      <button data-bg="transparent" class="on">透過</button>
      <button data-bg="dark">暗</button>
      <button data-bg="light">明</button>
      <button data-bg="checker">市松</button>
    </span>
    <span class="l2-sep"></span>
    <label class="l2-check"><input id="pv-pivots" type="checkbox"><span>ピボット表示</span></label>
    <span class="l2-spacer"></span>
    <button id="pv-to-editor" class="l2-ref" title="編集タブへ戻る">← 編集へ戻る</button>
  </div>
  <div class="l2-prev-stage" id="pv-stage">
    <canvas id="pv-canvas"></canvas>
  </div>
  <div id="pv-status" class="l2-status">現在のリグを大きく表示します。①でリグを作成してください。</div>
</section>

<!-- ===================== PLAYER ===================== -->
<section id="pane-player" class="l2-pane" style="display:none">
  <div class="l2-actions">
    <button id="btn-pl-open" class="l2-primary">📂 rig.json を開く</button>
    <input id="pl-file" type="file" accept="application/json,.json" hidden>
    <button id="btn-pl-demo">✨ デモドラゴン</button>
    <label class="l2-check"><input id="pl-pivots" type="checkbox"><span>ピボット表示</span></label>
  </div>
  <div class="l2-player-stage">
    <canvas id="pl-canvas" width="900" height="600"></canvas>
  </div>
  <div id="pl-status" class="l2-status">rig.json をドラッグ&ドロップ、または「デモドラゴン」。</div>
</section>

<script src="js/util.js"></script>
<script src="js/rig.js"></script>
<script src="js/segment.js"></script>
<script src="js/demo.js"></script>
<script src="js/player.js"></script>
<script src="js/ai.js"></script>
<script src="js/editor.js"></script>
<script src="js/app.js"></script>
</body>
</html>
