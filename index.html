<body>
<header id="header">
  <div class="hd-brand">
    <span class="hd-crest">🐲</span>
    <h1>聖龍爆走録ミミ<span class="subtitle">／転生したらバニーガールだった私の汎用スキル《ぱほぱほ》だけがレベルアップな件</span></h1>
  </div>
  <div class="header-info">
    <span class="hd-pill hd-coin" title="所持コイン"><span class="hd-pill-ic">🪙</span><b id="coin-display">1000</b></span>
    <span class="hd-pill hd-rank" title="プレイヤーランク"><span class="hd-pill-ic">🏅</span><span class="hd-pill-k">ランク</span><b id="rank-display">1</b></span>
    <label class="debug-toggle"><input type="checkbox" id="debug-toggle"> デバッグ</label>
  </div>
</header>

<main id="app">
  <!-- 画面はJSで描画 -->
</main>

<div id="event-overlay" class="hidden">
  <div class="event-box">
    <div class="event-speaker" id="event-speaker">ミミ</div>
    <div class="event-text" id="event-text"></div>
    <button id="event-close">次へ</button>
  </div>
</div>

<!--
  Load order matters (no module system).
  1) utils.js          — dependency-free helpers
  2) data_*            — pure data + extension-point comments
  3) state.js          — state store + save/load + progression helpers
  4) *_engine.js       — pure logic (depends on data + utils)
  5) event_hooks.js    — event system core
  6) event_registry.js — event registrations (depends on system + data)
  7) ui_render.js      — DOM rendering
  8) sim_tools.js      — debug/balance harness
  9) main.js           — entry point, wires everything
-->
