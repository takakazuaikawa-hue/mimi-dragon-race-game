<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>聖龍爆走録ミミ ／ 転生したらバニーガールだった私の汎用スキル《ぱほぱほ》だけがレベルアップな件</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="header">
  <h1>聖龍爆走録ミミ<span class="subtitle">／転生したらバニーガールだった私の汎用スキル《ぱほぱほ》だけがレベルアップな件</span></h1>
  <div class="header-info">
    <span class="coins">所持コイン: <b id="coin-display">1000</b></span>
    <span class="rank">プレイヤーランク: <b id="rank-display">1</b></span>
    <label class="info-level-select">情報量:
      <select id="info-level">
        <option value="simple">簡易</option>
        <option value="standard" selected>標準</option>
        <option value="advanced">詳細</option>
        <option value="expert">エキスパート</option>
      </select>
    </label>
    <label class="debug-toggle"><input type="checkbox" id="debug-toggle"> デバッグ</label>
  </div>
</header>

<main id="app">
  <!-- 画面はJSで描画 -->
</main>

<div id="event-overlay" class="hidden">
  <div class="event-box">
    <div class="event-speaker" id="event-speaker">ミミ</div>
    <div class="event-text" id="event-text"></div>
    <button id="event-close">次へ</button>
  </div>
</div>

<!--
  Load order matters (no module system).
  1) utils.js          — dependency-free helpers
  2) data_*            — pure data + extension-point comments
  3) state.js          — state store + save/load + progression helpers
  4) *_engine.js       — pure logic (depends on data + utils)
  5) event_hooks.js    — event system core
  6) event_registry.js — event registrations (depends on system + data)
  7) ui_render.js      — DOM rendering
  8) sim_tools.js      — debug/balance harness
  9) main.js           — entry point, wires everything
-->
<script src="js/utils.js"></script>
<script src="js/data_dragons.js"></script>
<script src="js/data_courses.js"></script>
<script src="js/data_weather.js"></script>
<script src="js/data_ranks.js"></script>
<script src="js/data_assets.js"></script>
<script src="js/data_races.js"></script>
<script src="js/state.js"></script>
<script src="js/race_engine.js"></script>
<script src="js/odds_engine.js"></script>
<script src="js/betting_engine.js"></script>
<script src="js/analysis_engine.js"></script>
<script src="js/assets_engine.js"></script>
<script src="js/recap_engine.js"></script>
<script src="js/broadcast_engine.js"></script>
<script src="js/commentary_data.js"></script>
<script src="js/commentary_engine.js"></script>
<script src="js/event_hooks.js"></script>
<script src="js/event_registry.js"></script>
<script src="js/ui_render.js"></script>
<script src="js/sim_tools.js"></script>
<script src="js/main.js"></script>
</body>
</html>
