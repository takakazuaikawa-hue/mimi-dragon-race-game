<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>文章送りデモ — D4決裁用</title>
<link rel="stylesheet" href="style.css?v=demo1">
<style>
  /* デモ用の枠だけ。VN箱そのものは本番の style.css をそのまま使う＝
     選ばれた案を、見えたまま dialogue.js へ写せる。 */
  body { margin: 0; background: #14161b; color: #e9e2d4;
    font-family: "Hiragino Sans","Yu Gothic","Meiryo",sans-serif; }
  .d-wrap { max-width: 760px; margin: 0 auto; padding: 18px 14px 60px; }
  .d-h { font-size: 17px; font-weight: 900; color: #ffd877; }
  .d-s { margin-top: 6px; font-size: 12.5px; line-height: 1.8; color: #b9b1a2; }
  .d-tabs { display: flex; gap: 8px; margin: 16px 0 10px; }
  .d-tab { flex: 1; padding: 11px 6px; border-radius: 12px; cursor: pointer;
    background: #23262d; color: #cfc7b8; border: 1px solid #383c45; font-weight: 900; font-size: 13px; }
  .d-tab.on { background: linear-gradient(180deg,#4a4028,#332c1c); color: #ffd877; border-color: #caa24a; }
  .d-tab small { display: block; margin-top: 3px; font-size: 10.5px; font-weight: 700; opacity: .75; }
  .d-stage { position: relative; margin-top: 6px; padding: 10px 0 4px; border-radius: 16px;
    background: radial-gradient(120% 90% at 50% 0%, #2a2f3a 0%, #171a20 70%); border: 1px solid #2f343d; }
  .d-note { margin: 10px 2px 0; font-size: 12px; line-height: 1.8; color: #9fb8a8; }
  .d-bar { display: flex; gap: 8px; margin-top: 12px; }
  .d-btn { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid #4a5560; cursor: pointer;
    background: #262b33; color: #e9e2d4; font-weight: 900; font-size: 13px; }
  .d-btn.primary { background: linear-gradient(180deg,#5a4a26,#3d3219); color: #ffd877; border-color: #caa24a; }
  .d-hint { margin-top: 12px; font-size: 12px; color: #8d9aa5; line-height: 1.8; }
  /* デモ内では箱を絶対配置しない（本番は画面下部に固定） */
  .d-stage .dlg-box { margin: 0 auto 10px; }

  /* ── B案／C案の文字表示：1文字ずつ span にして、浮かび上がらせる ── */
  .dlg-text .ch { display: inline-block; white-space: pre-wrap;
    opacity: 0; transform: translateY(5px); }
  .dlg-text .ch.in { opacity: 1; transform: none;
    transition: opacity .19s ease-out, transform .19s cubic-bezier(.2,.9,.3,1), filter .19s ease-out; }
  /* C案だけ：にじみ（インクが紙に落ちる感じ） */
  .c-mode .dlg-text .ch { filter: blur(2.4px); }
  .c-mode .dlg-text .ch.in { filter: blur(0); }
  /* C案だけ：名前プレートが先にすっと入る */
  .c-mode .dlg-name { animation: dNameIn .34s cubic-bezier(.2,1.2,.35,1) both; }
  @keyframes dNameIn { from { opacity:0; transform: translateX(-10px) } to { opacity:1; transform:none } }
</style>
</head>
<body>
<div class="d-wrap">
  <div class="d-h">📖 文章送りデモ（D4・決裁用）</div>
  <div class="d-s">
    同じ台詞を3つの送り方で出します。<b>箱をタップすると次へ</b>（本番と同じ操作）。
    打っている途中でタップすると、本番どおり一気に表示されます。<br>
    比べるところは「<b>文字がどう現れるか</b>」の一点です。箱・字・▼・音は3案とも同じものを使っています。
  </div>

  <div class="d-tabs">
    <button class="d-tab on" data-m="a">A：いまのゲーム<small>そのまま</small></button>
    <button class="d-tab" data-m="b">B：浮かび上がる<small>＋読点で息継ぎ</small></button>
    <button class="d-tab" data-m="c">C：にじんで出る<small>B＋インク感</small></button>
  </div>

  <div class="d-stage" id="stage">
    <div class="dlg-box" id="box">
      <span class="dlg-name" id="name">ミミ</span>
      <div class="dlg-text" id="text"></div>
      <span class="dlg-next" id="next" style="visibility:hidden">▼</span>
    </div>
  </div>

  <div class="d-note" id="note"></div>

  <div class="d-bar">
    <button class="d-btn primary" id="replay">↻ 最初から見る</button>
    <button class="d-btn" id="next3">▶ この案で続きを見る</button>
  </div>

  <div class="d-hint">
    ※ このページは決裁用の使い捨てです。選ばれた案だけを <code>js/dialogue.js</code> に写して、このファイルは消します。<br>
    ※ 端末の「視差効果を減らす」がONのときは、3案とも一括表示に倒れます（本番と同じ挙動）。
  </div>
</div>

<script>
// =========================================================================
// 3案の違いは「1文字をどう出すか」だけ。速さ・音・▼・箱は本番と同一に揃える。
//   A = いまの実装：textContent = full.slice(0, n)（パッと出る）
//   B = 1文字ずつ span を透明→不透明＋5px浮上（190ms）。さらに句読点で自然に溜める
//   C = B ＋ にじみ（blur 2.4px→0）と、名前プレートのスライドイン
// ★速さの基準は本番と同じ 22ms/字。B/Cの「溜め」は句読点だけに足す（読む速さは変えない）。
// =========================================================================
var SPEED = 22;                  // 本番 dialogue.js の opts.speed 既定値
var PAUSE = { "、": 90, "，": 90, "。": 190, "！": 190, "？": 190, "…": 70, "—": 70 };
var REDUCE = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

var LINES = [
  { n: "ミミ", t: "……ねえ、聞いてください。今日のレース、わたし、ぜんぶ見えてたんです。" },
  { n: "ミミ", t: "ゲートが開いた瞬間に、あの子だけ線がまっすぐで。ほかの子は、ちょっとだけ迷ってた。" },
  { n: "サケ・ウダダ", t: "……ふん。理屈は後づけでいい。見えたものを信じられるかどうかだ、この稼業は。" },
  { n: "ミミ", t: "はいっ！　……あの、それはそれとして、おなかすきました！" }
];

var mode = "a", idx = 0, typing = false, timer = 0, chars = [], shown = 0;
var elBox = document.getElementById("box"), elName = document.getElementById("name"),
    elText = document.getElementById("text"), elNext = document.getElementById("next"),
    elStage = document.getElementById("stage"), elNote = document.getElementById("note");

var NOTES = {
  a: "いまのゲーム。文字は <b>slice で切って一気に差し替え</b> ています。1文字ずつ増えてはいますが、"
   + "1文字1文字は「パッ」と出るので、機械が印字している感じに寄ります。",
  b: "1文字ずつ <b>透明から浮かび上がる</b>（190ms）。あわせて <b>句読点で息を継ぎます</b>"
   + "（、で+90ms／。！？で+190ms）。読む速さ自体はAと同じで、リズムだけが台詞らしくなります。",
  c: "Bに <b>にじみ</b> を足したもの（ぼけた状態から像を結ぶ）。名前プレートも先にすっと入ります。"
   + "情感は出ますが、長い台詞では少しうるさく感じるかもしれません。"
};

function clear() { clearTimeout(timer); typing = false; }

function show(line) {
  clear();
  elName.textContent = line.n;
  elNext.style.visibility = "hidden";
  elStage.classList.toggle("c-mode", mode === "c");
  var s = line.t;
  if (REDUCE) { elText.textContent = s; elNext.style.visibility = "visible"; return; }

  if (mode === "a") {
    // ── A：本番と同じ slice 方式 ──
    elText.textContent = "";
    shown = 0; typing = true;
    (function tick() {
      if (!typing) return;
      shown++;
      elText.textContent = s.slice(0, shown);
      if (shown >= s.length) { typing = false; elNext.style.visibility = "visible"; return; }
      timer = setTimeout(tick, SPEED);
    })();
    return;
  }

  // ── B/C：1文字ずつ span にして順に .in を付ける ──
  elText.textContent = "";
  chars = [];
  for (var i = 0; i < s.length; i++) {
    var sp = document.createElement("span");
    sp.className = "ch";
    sp.textContent = s[i];
    elText.appendChild(sp);
    chars.push(sp);
  }
  shown = 0; typing = true;
  (function tick() {
    if (!typing) return;
    var sp = chars[shown];
    if (sp) sp.classList.add("in");
    var c = s[shown];
    shown++;
    if (shown >= s.length) {
      typing = false;
      setTimeout(function () { if (!typing) elNext.style.visibility = "visible"; }, 190);
      return;
    }
    timer = setTimeout(tick, SPEED + (PAUSE[c] || 0));
  })();
}

function advance() {
  if (typing) {                       // 打っている途中のタップ＝一気に表示（本番と同じ）
    clear();
    if (mode === "a") elText.textContent = LINES[idx].t;
    else chars.forEach(function (sp) { sp.classList.add("in"); });
    elNext.style.visibility = "visible";
    return;
  }
  idx = (idx + 1) % LINES.length;
  show(LINES[idx]);
}

elBox.addEventListener("click", advance);
document.getElementById("replay").onclick = function (e) { e.stopPropagation(); idx = 0; show(LINES[0]); };
document.getElementById("next3").onclick = function (e) { e.stopPropagation(); advance(); };

[].forEach.call(document.querySelectorAll(".d-tab"), function (b) {
  b.onclick = function () {
    [].forEach.call(document.querySelectorAll(".d-tab"), function (x) { x.classList.remove("on"); });
    b.classList.add("on");
    mode = b.getAttribute("data-m");
    elNote.innerHTML = NOTES[mode];
    idx = 0; show(LINES[0]);
  };
});

elNote.innerHTML = NOTES.a;
show(LINES[0]);
</script>
</body>
</html>
